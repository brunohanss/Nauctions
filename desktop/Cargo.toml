[package]
name = "nauctions-desktop"
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
market-telemetry = { path = "../crates/telemetry" }
zip = { version = "9", default-features = false }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
auto-launch = "0.6"
market-game-process = { path = "../crates/game-process" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
percent-encoding = "2"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.12.4", features = ["test"] }

[profile.release]
lto = "thin"
strip = "none"
debug = 1
