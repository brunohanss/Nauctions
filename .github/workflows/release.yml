name: prepare desktop release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested release
        type: boolean
        default: false
  push:
    branches: ['codex/release-0.5.0']
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  desktop-checks:
    uses: ./.github/workflows/desktop.yml
  package:
    needs: [checks, desktop-checks]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - shell: pwsh
        run: npm ci --prefix web
      - name: Build addon and signed companion
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || secrets.POSTHOG_PROJECT_ID }}
        run: |
          if (!$env:POSTHOG_API_KEY) { throw 'Set the POSTHOG_API_KEY repository secret before preparing a monitored release.' }
          ./scripts/release-package.ps1
      - name: Retain matching native debug symbols and local source maps
        uses: actions/upload-artifact@v4
        with:
          name: nauctions-release-symbols
          path: artifacts/symbols/
          retention-days: 30
      - name: Verify the signed release package
        shell: pwsh
        run: |
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $env:NAUCTIONS_RELEASE_INSTALLER = Join-Path $PWD "artifacts/desktop/Nauctions_${version}_x64-setup.exe"
          cargo test --manifest-path desktop/Cargo.toml --locked release_installer_matches_the_shipped_key_and_manifest -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Signed release package verification failed.' }
      - name: Download the published previous installer for the upgrade trial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.4.2 --pattern Nauctions_0.4.2_x64-setup.exe --dir artifacts/previous-installer
      - name: Test the exact signed installer and previous-version upgrade
        shell: pwsh
        run: |
          $previous = 'artifacts/previous-installer/Nauctions_0.4.2_x64-setup.exe'
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c90d5edc35a3cbdebbbbab6c86fca5e9557c29f665ed1d832d8a03557f17673f') { throw 'Previous installer identity differs from the published 0.4.2 package.' }
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/installer-smoke.ps1 -Installer "artifacts/desktop/Nauctions_${version}_x64-setup.exe" -PreviousInstaller $previous
      - name: Retain both release packages
        uses: actions/upload-artifact@v4
        with:
          name: nauctions-release-packages
          path: |
            artifacts/desktop/*-setup.exe
            artifacts/desktop/*-setup.exe.sig
            artifacts/desktop/*-setup.exe.sha256
            artifacts/desktop/nauctions-ahdb.zip
            artifacts/desktop/nauctions-ahdb.zip.sha256
            artifacts/desktop/latest.json
            artifacts/desktop/release-info.json
          if-no-files-found: error
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content artifacts/desktop/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw 'Release versions differ.' }
          $record = Get-Content artifacts/desktop/release-info.json -Raw | ConvertFrom-Json
          if ($record.revision -ne $env:GITHUB_SHA) { throw 'Release revision differs from the checked source.' }
          $addon = 'artifacts/desktop/nauctions-ahdb.zip'
          if ($record.addon_sha256 -ne (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Addon checksum differs from the release record.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'The build changed tracked source files.' }
          $installer = "artifacts/desktop/Nauctions_${version}_x64-setup.exe"
          gh release create "v$version" $installer "$installer.sig" "$installer.sha256" $addon "$addon.sha256" artifacts/desktop/latest.json artifacts/desktop/release-info.json --draft --target $env:GITHUB_SHA --title "Nauctions $version" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the draft release. Do not replace an existing release.' }
      - name: Publish the accepted friend release
        if: github.ref == 'refs/heads/codex/release-0.5.0' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
