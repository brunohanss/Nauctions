[package]
name = "market-server"
version = "0.1.0"
edition = "2021"

[dependencies]
market-telemetry = { path = "../telemetry" }
ahdb-format = { path = "../ahdb-format" }
market-domain = { path = "../domain" }
market-analysis = { path = "../analysis" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { package = "market-storage", path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aes-gcm = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
